    "name": "Hadamard completion, weighing matrices, and extension methods",
    "description": "We construct a 16 by 24 partial Hadamard matrix whose minimum augmenting row-exchange cost is exactly three, and prove that this cost remains exactly three after tensoring with any full Hadamard matrix. For square weighing matrices of order divisible by four with two zeros per row, a real-valued filling exists exactly when a sign-valued Hadamard filling exists. We also classify the real subspaces containing the maximum possible number of sign vectors and derive a smaller-order completion criterion. See README.md for the main theorem statements, RESULTS.md for further results, paper/main.pdf for proofs and citations, and TECHNICAL.md for formalization coverage and build details.",
