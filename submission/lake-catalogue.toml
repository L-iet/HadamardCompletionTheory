# Library catalogue; executable native-aware configuration is lakefile.lean.
name = "completion_theory"
version = "0.1.0"
defaultTargets = ["CompletionTheory", "Solution", "AlgorithmSolution", "RepairSolution", "CodeSolution", "LatticeSolution", "CharacterSolution", "BlochSolution", "QuaternarySolution", "CyclicExistenceSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "CompletionTheory"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "PhaseGeometry"

[[lean_lib]]
name = "HadamardMultibase"

[[lean_lib]]
name = "AlgorithmChallenge"

[[lean_lib]]
name = "AlgorithmSolution"

[[lean_lib]]
name = "CompletionRepair"
moreLeanArgs = ["-M4096"]

[[lean_lib]]
name = "RepairChallenge"

[[lean_lib]]
name = "RepairSolution"

[[lean_lib]]
name = "CompletionCodeTrap"
